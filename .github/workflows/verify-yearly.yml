name: Verify yearly updated (Layer 4)

# 目的: 毎月1日 update-yearly が実際に発火したか翌日に検証。
# jm-yearly.json の updatedAt が 30h 以上前なら発火漏れとして Chatwork 通知。

on:
  schedule:
    # 毎月2日 00:00 UTC = 09:00 JST (update-yearly の翌日)
    - cron: '0 0 2 * *'
  workflow_dispatch:

concurrency:
  group: verify-yearly
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify updatedAt (< 30h ago)
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/verify_yearly_freshness.py

      - name: Notify verify workflow failure
        if: failure()
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -s -X POST -H "X-ChatWorkToken: $CHATWORK_API_TOKEN" \
            --data-urlencode "body=[info][title]⚠ verify-yearly workflow 自体が失敗[/title]takuzooo-dashboard verify-yearly workflow が失敗しました (Layer 4 崩壊)。%0ARun: https://github.com/${REPO}/actions/runs/${RUN_ID}[/info]" \
            --data-urlencode "self_unread=1" \
            "https://api.chatwork.com/v2/rooms/218962687/messages"
