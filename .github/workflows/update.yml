name: update-youtube-data

on:
  schedule:
    - cron: "7,37 * * * *"   # 30min, off-the-hour (skip-trigger対策・JM側とも分散)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-youtube-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch YouTube data
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python fetch_youtube.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # self-healing: retry with rebase on push conflict (max 3 attempts)
            for i in 1 2 3; do
              if git push; then echo "✅ push OK on attempt $i"; break; fi
              echo "⚠ push failed on attempt $i, rebasing origin/main..."
              git fetch origin main && git rebase origin/main
              sleep $((i * 2))
            done