name: Nyuukin Auto PayPal (Dropbox → Drive monthly)

on:
  schedule:
    # 月初 1-4日 9/10/11/12 JST (UTC 0/1/2/3)・月16run
    - cron: '0 0,1,2,3 1-4 * *'
    # 5日 10:00 JST (UTC 01:00)・fallback +1run
    - cron: '0 1 5 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (no writes)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      year:
        description: '対象年 (空欄=前月・上書き用)'
        required: false
        default: ''
      month:
        description: '対象月 (空欄=前月・上書き用)'
        required: false
        default: ''
  repository_dispatch:
    types: [nyuukin_auto_paypal_run]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r nyuukin_auto/scripts/requirements.txt

      - name: Run PayPal Dropbox → Drive sync
        env:
          # main.py の環境変数 required list に合わせて全キー渡す (未使用のものもダミー不要・実値注入)
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          KOMOJU_SECRET_KEY: ${{ secrets.KOMOJU_SECRET_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.year }}" ]; then ARGS="$ARGS --year ${{ github.event.inputs.year }}"; fi
          if [ -n "${{ github.event.inputs.month }}" ]; then ARGS="$ARGS --month ${{ github.event.inputs.month }}"; fi
          python3 nyuukin_auto/scripts/paypal_dropbox_to_drive.py $ARGS
