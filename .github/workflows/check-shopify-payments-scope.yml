name: Check Shopify Payments Scope (temporary)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scope + payouts sample
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, os
          store = os.environ["SHOPIFY_STORE"]
          cid = os.environ["SHOPIFY_CLIENT_ID"]
          csec = os.environ["SHOPIFY_CLIENT_SECRET"]
          # access_token
          req = urllib.request.Request(
              f"https://{store}/admin/oauth/access_token",
              data=urllib.parse.urlencode({"grant_type":"client_credentials","client_id":cid,"client_secret":csec}).encode(),
              headers={"Accept":"application/json"}
          )
          token = json.loads(urllib.request.urlopen(req).read())["access_token"]
          # scope 確認
          gql = json.dumps({"query":"{ currentAppInstallation { app { title } accessScopes { handle } } }"})
          req2 = urllib.request.Request(
              f"https://{store}/admin/api/2026-01/graphql.json",
              data=gql.encode(),
              headers={"X-Shopify-Access-Token":token,"Content-Type":"application/json"}
          )
          r = json.loads(urllib.request.urlopen(req2).read())
          scopes = sorted([s["handle"] for s in r["data"]["currentAppInstallation"]["accessScopes"]])
          print(f"App: {r['data']['currentAppInstallation']['app']['title']}")
          print(f"Scopes ({len(scopes)}):")
          for s in scopes:
              mark = "✅" if "payment" in s else "  "
              print(f"  {mark} {s}")
          has_payouts = 'read_shopify_payments_payouts' in scopes
          print(f"\nread_shopify_payments_payouts: {'✅ 追加済み' if has_payouts else '❌ 未追加'}")

          # schema introspection で正しい field 名確定
          if has_payouts:
              for tname in ["ShopifyPaymentsAccount", "ShopifyPaymentsPayout", "ShopifyPaymentsPayoutSummary"]:
                  qi = '{ __type(name: "' + tname + '") { fields { name type { name kind ofType { name kind } } } } }'
                  req_i = urllib.request.Request(
                      f"https://{store}/admin/api/2026-01/graphql.json",
                      data=json.dumps({"query": qi}).encode(),
                      headers={"X-Shopify-Access-Token":token,"Content-Type":"application/json"}
                  )
                  rr = json.loads(urllib.request.urlopen(req_i).read())
                  fields = rr.get("data", {}).get("__type", {}).get("fields", [])
                  print(f"\n=== {tname} fields ({len(fields)}) ===")
                  for f in fields:
                      t = f.get("type", {})
                      tn = t.get("name") or (t.get("ofType", {}).get("name") if t.get("ofType") else t.get("kind"))
                      print(f"  {f['name']}: {tn}")
          PYEOF
