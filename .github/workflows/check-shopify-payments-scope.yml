name: Check Shopify Payments Scope (temporary)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scope + payouts sample
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, os
          store = os.environ["SHOPIFY_STORE"]
          cid = os.environ["SHOPIFY_CLIENT_ID"]
          csec = os.environ["SHOPIFY_CLIENT_SECRET"]
          # access_token
          req = urllib.request.Request(
              f"https://{store}/admin/oauth/access_token",
              data=urllib.parse.urlencode({"grant_type":"client_credentials","client_id":cid,"client_secret":csec}).encode(),
              headers={"Accept":"application/json"}
          )
          token = json.loads(urllib.request.urlopen(req).read())["access_token"]
          # scope 確認
          gql = json.dumps({"query":"{ currentAppInstallation { app { title } accessScopes { handle } } }"})
          req2 = urllib.request.Request(
              f"https://{store}/admin/api/2026-01/graphql.json",
              data=gql.encode(),
              headers={"X-Shopify-Access-Token":token,"Content-Type":"application/json"}
          )
          r = json.loads(urllib.request.urlopen(req2).read())
          scopes = sorted([s["handle"] for s in r["data"]["currentAppInstallation"]["accessScopes"]])
          print(f"App: {r['data']['currentAppInstallation']['app']['title']}")
          print(f"Scopes ({len(scopes)}):")
          for s in scopes:
              mark = "✅" if "payment" in s else "  "
              print(f"  {mark} {s}")
          has_payouts = 'read_shopify_payments_payouts' in scopes
          print(f"\nread_shopify_payments_payouts: {'✅ 追加済み' if has_payouts else '❌ 未追加'}")

          def gql(query):
              req = urllib.request.Request(
                  f"https://{store}/admin/api/2026-01/graphql.json",
                  data=json.dumps({"query": query}).encode(),
                  headers={"X-Shopify-Access-Token":token,"Content-Type":"application/json"}
              )
              return json.loads(urllib.request.urlopen(req).read())

          # 直近 payout 3件
          print("\n=== 直近 payout 3件 (access 確認) ===")
          q1 = '{ shopifyPaymentsAccount { payouts(first: 3, reverse: true) { edges { node { id legacyResourceId issuedAt status net { amount currencyCode } summary { chargesGross { amount } chargesFee { amount } refundsFee { amount } refundsFeeGross { amount } adjustmentsGross { amount } adjustmentsFee { amount } } } } } } }'
          r1 = gql(q1)
          print(json.dumps(r1, indent=2, ensure_ascii=False))

          # balanceTransactions 直近 3件 (payout フィルタは query パラメータで)
          if 'errors' not in r1:
              recent_pid = r1['data']['shopifyPaymentsAccount']['payouts']['edges'][0]['node']['legacyResourceId']
              print(f"\n=== balanceTransactions of payout_id={recent_pid} ===")
              q2 = '{ shopifyPaymentsAccount { balanceTransactions(first: 5, query: "payout_id:' + str(recent_pid) + '") { edges { node { id type transactionDate amount { amount currencyCode } fee { amount } net { amount } sourceType sourceId sourceOrderTransactionId associatedOrder { id orderName } } } } } }'
              print(json.dumps(gql(q2), indent=2, ensure_ascii=False))

              # payoutId フィルタなしの直近
              print(f"\n=== balanceTransactions 直近 3件 (payout フィルタなし) ===")
              q3 = '{ shopifyPaymentsAccount { balanceTransactions(first: 3, reverse: true) { edges { node { id type transactionDate amount { amount currencyCode } fee { amount } net { amount } sourceType associatedOrder { id orderName } associatedPayout { id status transactedAt } } } } } }'
              print(json.dumps(gql(q3), indent=2, ensure_ascii=False))
          PYEOF
