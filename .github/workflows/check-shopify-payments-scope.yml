name: Check Shopify Payments Scope (temporary)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scope + payouts sample
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, os
          store = os.environ["SHOPIFY_STORE"]
          cid = os.environ["SHOPIFY_CLIENT_ID"]
          csec = os.environ["SHOPIFY_CLIENT_SECRET"]
          # access_token
          req = urllib.request.Request(
              f"https://{store}/admin/oauth/access_token",
              data=urllib.parse.urlencode({"grant_type":"client_credentials","client_id":cid,"client_secret":csec}).encode(),
              headers={"Accept":"application/json"}
          )
          token = json.loads(urllib.request.urlopen(req).read())["access_token"]
          # scope 確認
          gql = json.dumps({"query":"{ currentAppInstallation { app { title } accessScopes { handle } } }"})
          req2 = urllib.request.Request(
              f"https://{store}/admin/api/2026-01/graphql.json",
              data=gql.encode(),
              headers={"X-Shopify-Access-Token":token,"Content-Type":"application/json"}
          )
          r = json.loads(urllib.request.urlopen(req2).read())
          scopes = sorted([s["handle"] for s in r["data"]["currentAppInstallation"]["accessScopes"]])
          print(f"App: {r['data']['currentAppInstallation']['app']['title']}")
          print(f"Scopes ({len(scopes)}):")
          for s in scopes:
              mark = "✅" if "payment" in s else "  "
              print(f"  {mark} {s}")
          has_payouts = 'read_shopify_payments_payouts' in scopes
          print(f"\nread_shopify_payments_payouts: {'✅ 追加済み' if has_payouts else '❌ 未追加'}")

          # 追加 introspection + 実データ sample 取得
          def gql(query):
              req = urllib.request.Request(
                  f"https://{store}/admin/api/2026-01/graphql.json",
                  data=json.dumps({"query": query}).encode(),
                  headers={"X-Shopify-Access-Token":token,"Content-Type":"application/json"}
              )
              return json.loads(urllib.request.urlopen(req).read())

          # ShopifyPaymentsBalanceTransaction schema
          for tname in ["ShopifyPaymentsBalanceTransaction"]:
              qi = '{ __type(name: "' + tname + '") { fields { name type { name kind ofType { name kind } } } } }'
              rr = gql(qi)
              fields = rr.get("data", {}).get("__type", {}).get("fields", [])
              print(f"\n=== {tname} fields ({len(fields)}) ===")
              for f in fields:
                  t = f.get("type", {})
                  tn = t.get("name") or (t.get("ofType", {}).get("name") if t.get("ofType") else t.get("kind"))
                  print(f"  {f['name']}: {tn}")

          # 直近 payout 1件 + その balanceTransactions
          print("\n=== 直近 payout 1件 ===")
          q1 = '{ shopifyPaymentsAccount { payouts(first: 1, reverse: true) { edges { node { id legacyResourceId issuedAt status net { amount currencyCode } summary { chargesGross { amount } chargesFee { amount } refundsFee { amount } refundsFeeGross { amount } adjustmentsGross { amount } adjustmentsFee { amount } } } } } } }'
          print(json.dumps(gql(q1), indent=2, ensure_ascii=False))

          # payoutId query? balanceTransactions の arguments 確認
          print("\n=== balanceTransactions arguments ===")
          qa = '{ __type(name: "ShopifyPaymentsAccount") { fields { name args { name type { name kind ofType { name } } } } } }'
          rr = gql(qa)
          for f in rr.get("data", {}).get("__type", {}).get("fields", []):
              if f['name'] in ('balanceTransactions', 'payouts'):
                  print(f"  {f['name']}:")
                  for a in f.get('args', []):
                      t = a.get('type', {})
                      tn = t.get('name') or (t.get('ofType', {}).get('name') if t.get('ofType') else t.get('kind'))
                      print(f"    {a['name']}: {tn}")
          PYEOF
