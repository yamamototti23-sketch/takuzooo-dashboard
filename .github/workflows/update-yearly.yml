name: Update yearly (rolling 12M) monthly

on:
  schedule:
    # 毎月1日 00:00 UTC = 09:00 JST
    - cron: '0 0 1 * *'
  workflow_dispatch:  # 手動発火可 (発火漏れ復旧用)

concurrency:
  group: update-yearly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup freee .env (Secrets → /tmp/freee.env)
        env:
          FREEE_ACCESS_TOKEN: ${{ secrets.FREEE_ACCESS_TOKEN }}
          FREEE_REFRESH_TOKEN: ${{ secrets.FREEE_REFRESH_TOKEN }}
          FREEE_CLIENT_ID: ${{ secrets.FREEE_CLIENT_ID }}
          FREEE_CLIENT_SECRET: ${{ secrets.FREEE_CLIENT_SECRET }}
          FREEE_REDIRECT_URI: ${{ secrets.FREEE_REDIRECT_URI }}
          FREEE_COMPANY_ID: ${{ secrets.FREEE_COMPANY_ID }}
        run: |
          cat > /tmp/freee.env <<EOF
          FREEE_ACCESS_TOKEN=${FREEE_ACCESS_TOKEN}
          FREEE_REFRESH_TOKEN=${FREEE_REFRESH_TOKEN}
          FREEE_CLIENT_ID=${FREEE_CLIENT_ID}
          FREEE_CLIENT_SECRET=${FREEE_CLIENT_SECRET}
          FREEE_REDIRECT_URI=${FREEE_REDIRECT_URI}
          FREEE_COMPANY_ID=${FREEE_COMPANY_ID}
          EOF
          chmod 600 /tmp/freee.env

      - name: Generate jm-yearly.json
        # 注: dashboard app (SHOPIFY_CLIENT_ID) は read_all_orders scope 無しで
        # 60日以内 orders しか取れず 7ヶ月集計不能。customer-master app 経由に切替。
        # freee 部分は fail-soft (取得失敗時は profit なしで JSON 生成継続)。
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CM_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CM_CLIENT_SECRET }}
          BASE_MONTHLY_JSON: docs/base_monthly.json
          FREEE_LIB_PATH: scripts  # takuzooo-dashboard 内 scripts/lib_freee.py を使用
          FREEE_ENV_PATH: /tmp/freee.env
          YEARLY_LAG_MONTHS: "2"  # 新税理士 (原様) のラグ短縮確定後は "1" に変更
        run: python3 scripts/generate_yearly.py

      - name: Sync refreshed tokens back to GitHub Secrets
        # 恒久対策 (2026-10-19 事故起点): freee refresh token は rotating 仕様で、
        # lib_freee が /tmp/freee.env に書き戻した新 token を Secret にも反映しないと
        # 次回 run 時に旧 token から再 refresh を試み、ローカル freee-accounting スキル
        # 側で先に refresh されていた場合 HTTP 401 で失敗する (経路競合)。
        # 新規発行 freee OAuth アプリ (client_id=825046424280243・プライベート・2026-10-19)
        # で経路分離済みのため、本 step で書き戻せば rotating token を回し続けられる。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠ SECRETS_WRITE_PAT 未設定 → token 書き戻しスキップ"
            exit 0
          fi
          if [ ! -f /tmp/freee.env ]; then
            echo "⚠ /tmp/freee.env が存在しない → skip"
            exit 0
          fi
          NEW_AT=$(grep '^FREEE_ACCESS_TOKEN=' /tmp/freee.env | cut -d= -f2-)
          NEW_RT=$(grep '^FREEE_REFRESH_TOKEN=' /tmp/freee.env | cut -d= -f2-)
          if [ -z "$NEW_AT" ] || [ -z "$NEW_RT" ]; then
            echo "⚠ /tmp/freee.env に token が空 → skip"
            exit 0
          fi
          # 旧 Secret 値と比較して差分がある時だけ更新 (無駄な audit log 削減)
          OLD_AT_HASH=$(gh secret list --repo ${{ github.repository }} --json name,updatedAt --jq '.[] | select(.name=="FREEE_ACCESS_TOKEN") | .updatedAt')
          NEW_AT_HASH=$(echo -n "$NEW_AT" | shasum | cut -d' ' -f1)
          echo "FREEE_ACCESS_TOKEN hash: $NEW_AT_HASH (prev updated: $OLD_AT_HASH)"
          echo -n "$NEW_AT" | gh secret set FREEE_ACCESS_TOKEN --repo ${{ github.repository }}
          echo -n "$NEW_RT" | gh secret set FREEE_REFRESH_TOKEN --repo ${{ github.repository }}
          echo "✅ freee token 書き戻し完了 (next run uses rotated tokens)"

      - name: Cleanup freee .env (secret 漏洩防止)
        if: always()
        run: rm -f /tmp/freee.env

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jm-yearly.json
          if git diff --cached --quiet -- docs/jm-yearly.json; then
            echo "no change in jm-yearly.json"
          else
            git commit -m "chore(yearly): monthly update $(date -u +%Y-%m) [skip ci]"
            for i in 1 2 3; do
              if git push; then echo "push OK on attempt $i"; break; fi
              echo "push failed on attempt $i, rebasing origin/main..."
              git fetch origin main && git rebase origin/main
              sleep $((i * 2))
            done
          fi

      - name: Notify success (Chatwork マイチャット・月次可視化)
        if: success()
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
        run: python3 scripts/notify_yearly_success.py

      - name: Notify failure (Chatwork マイチャット・即修復依頼)
        if: failure()
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -s -X POST -H "X-ChatWorkToken: $CHATWORK_API_TOKEN" \
            --data-urlencode "body=[info][title]⚠ 年計 月次更新 失敗[/title]takuzooo-dashboard update-yearly workflow が失敗しました。%0ARun: https://github.com/${REPO}/actions/runs/${RUN_ID}%0A月1回発火のため次回まで見逃すと1ヶ月遅延。即座に手動対応してください。%0A手動発火: https://github.com/${REPO}/actions/workflows/update-yearly.yml[/info]" \
            --data-urlencode "self_unread=1" \
            "https://api.chatwork.com/v2/rooms/218962687/messages"
