<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Japan Made屋 — 月間売上 3年比較</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    overflow: hidden;
  }
  .wrap { display: flex; flex-direction: column; height: 100vh; padding: 24px 32px; }
  .header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 14px; border-bottom: 1px solid #333;
  }
  .title {
    font-size: 24px; font-weight: 700; letter-spacing: 0.06em; color: #eee;
  }
  .title small { color: #888; font-size: 14px; margin-left: 12px; font-weight: 400; }
  .updated { color: #666; font-size: 12px; }

  .chart-wrap {
    flex: 1; position: relative; margin-top: 16px;
    min-height: 300px;
  }
  canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }

  .footer {
    padding-top: 10px; font-size: 11px; color: #555; text-align: center;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">月間売上金額 <small>3年比較 (BASE+Shopify 合計)</small></div>
    <div class="updated" id="updated"></div>
  </div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
  <div class="footer" id="footer"></div>
</div>
<script>
  const JSON_URL = './jm-3yr-amount.json';
  const REFRESH_MS = 60 * 1000; // 60秒ごとに再フェッチ

  // 案2 カラーパレット (信号機型・赤強調)
  const PALETTE = {
    // 今年 = 極太・濃赤・実線・最強調 (視線がまずここに来る)
    current: { color: '#E63946', width: 7.0, alpha: 1.00, pointRadius: 9, dash: []    , labelSize: 15 },
    // 昨年 = 細・薄オレンジ・破線 (補足情報・2026-10-20 さらに20%薄く)
    prev1:   { color: '#F4A261', width: 2.0, alpha: 0.45, pointRadius: 3, dash: [6, 4], labelSize: 10 },
    // 2年前 = さらに細・さらに薄グレー・短破線 (背景補足)
    prev2:   { color: '#B0B0B0', width: 1.5, alpha: 0.30, pointRadius: 2, dash: [3, 3], labelSize: 9  },
  };

  const MONTH_LABELS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  let chart = null;

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function toManEn(yen) {
    if (yen === null || yen === undefined) return null;
    return Math.round(yen / 10000); // 万円
  }

  function buildDataset(year, yearData, isCurrent, isPrev1) {
    const style = isCurrent ? PALETTE.current : (isPrev1 ? PALETTE.prev1 : PALETTE.prev2);
    const rgba = hexToRgba(style.color, style.alpha);
    const data = MONTH_LABELS.map((_, i) => toManEn(yearData[String(i + 1)]));
    return {
      label: year + '年' + (isCurrent ? ' (今年)' : ''),
      data: data,
      borderColor: rgba,
      backgroundColor: rgba,
      borderWidth: style.width,
      borderDash: style.dash,
      pointRadius: style.pointRadius,
      pointHoverRadius: style.pointRadius + 2,
      tension: 0.3,
      spanGaps: false,
      order: isCurrent ? 1 : (isPrev1 ? 2 : 3),  // 今年を最前面に (order小さいほど前)
      datalabels: {
        align: 'top',
        anchor: 'end',
        color: rgba,
        font: { size: style.labelSize, weight: isCurrent ? 'bold' : 'normal' },
        display: (ctx) => ctx.dataset.data[ctx.dataIndex] != null,
        formatter: (v) => v != null ? v.toLocaleString() : '',
      },
    };
  }

  async function load() {
    try {
      const res = await fetch(JSON_URL + '?_=' + Date.now());
      const d = await res.json();

      const years = d.years;
      const currentYear = d.current_year;
      const datasets = years.map((y, i) => {
        const isCurrent = (y === currentYear);
        const isPrev1 = (y === currentYear - 1);
        return buildDataset(y, d.data[String(y)], isCurrent, isPrev1);
      });

      // 描画順: 2年前 → 昨年 → 今年 (今年が最前面)
      // 既に years 配列順 (昇順) なので OK

      if (chart) chart.destroy();
      const ctx = document.getElementById('chart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: { labels: MONTH_LABELS, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 400 },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              align: 'end',
              labels: {
                color: '#ddd',
                font: { size: 14, weight: 'bold' },
                padding: 20,
                usePointStyle: true,
                pointStyle: 'line',
              },
            },
            datalabels: { display: true },
            tooltip: {
              callbacks: {
                label: (ctx) => ctx.dataset.label + ': ' + (ctx.parsed.y != null ? ctx.parsed.y.toLocaleString() + '万円' : '-'),
              },
            },
          },
          scales: {
            x: {
              grid: { color: '#222', drawBorder: false },
              ticks: { color: '#aaa', font: { size: 13 } },
            },
            y: {
              beginAtZero: true,
              grid: { color: '#222', drawBorder: false },
              ticks: {
                color: '#aaa',
                font: { size: 12 },
                callback: (v) => v.toLocaleString() + '万',
              },
              title: {
                display: true,
                text: '月販売額 (万円)',
                color: '#888',
                font: { size: 12 },
              },
            },
          },
        },
        plugins: [ChartDataLabels],
      });

      // header
      const upd = new Date(d.updatedAt);
      document.getElementById('updated').textContent =
        '更新: ' + upd.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      document.getElementById('footer').textContent =
        'データ源: BASE 月次 (〜2026-04) + Shopify Admin GraphQL orders (2026-02〜当月・currentTotalPrice税込返金反映後)・年次ロールオーバー: 毎年1/1 に3年前 drop';

    } catch (e) {
      console.error('load error:', e);
      document.getElementById('footer').textContent = '読み込みエラー: ' + e.message;
    }
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
